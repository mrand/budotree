  description:
    en: >-
      1956 Okinawa Judo Champion, the All Marine Corps Judo Champion from 1959 to 1963 (seven consecutive years in his weight class), 
      the overall All Marine Corps Judo Champion for five consecutive years when he defeated all weight groups, 
      a two-time Inter-Service Judo Grand Champion and a five-time Eastern U.S. Champion.
      10th Dan and co-founder of Neko-Ryu-Goshin-Jitsu.  
      Only American to receive Japanese Ambassador’s Cup in Judo (1962). 
      Fourth in his weight group at the first U.S. Olympic Trials for Judo (1964 World’s Fair New York).
